name: GUI Publish

on:
  release:
    types: [ published ]

env:
  VERSION: 0.0.0-local
  GUI_PROJECT: src/Csv2Ofx.Gui/Csv2Ofx.Gui.csproj

jobs:
  test:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore -c Release
      - name: Test
        run: dotnet test -c Release --no-build --verbosity normal

  publish-gui:
    needs: test
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
            package: appimage
            artifact: csv2ofx-gui-linux-x64-package
          - rid: osx-x64
            os: macos-latest
            package: macos-app
            artifact: csv2ofx-gui-osx-x64-package
          - rid: osx-arm64
            os: macos-latest
            package: macos-app
            artifact: csv2ofx-gui-osx-arm64-package
          - rid: win-x64
            os: ubuntu-latest
            package: zip
            artifact: csv2ofx-gui-win-x64-package
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Set version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" == gui-v* ]]; then
            VERSION="${GITHUB_REF_NAME#gui-v}"
          else
            VERSION="0.0.0-local"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Publish self-contained GUI
        run: |
          dotnet publish "$GUI_PROJECT" \
            -c Release \
            -r "${{ matrix.rid }}" \
            --self-contained true \
            --framework net8.0 \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:Version=${{ env.VERSION }} \
            -o "artifacts/publish/${{ matrix.rid }}"
      - name: Package Linux AppImage
        if: matrix.package == 'appimage'
        run: |
          chmod +x build/package-linux-appimage.sh
          build/package-linux-appimage.sh \
            "artifacts/publish/${{ matrix.rid }}" \
            "artifacts/packages" \
            "${{ env.VERSION }}"
      - name: Package macOS app bundle
        if: matrix.package == 'macos-app'
        run: |
          chmod +x build/package-macos-app.sh
          build/package-macos-app.sh \
            "artifacts/publish/${{ matrix.rid }}" \
            "artifacts/packages" \
            "${{ matrix.rid }}" \
            "${{ env.VERSION }}"
      - name: Package Windows zip
        if: matrix.package == 'zip'
        run: |
          mkdir -p artifacts/packages
          cd artifacts/publish/${{ matrix.rid }}
          zip -r ../../packages/Csv2Ofx-Gui-${{ env.VERSION }}-${{ matrix.rid }}.zip .
      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/packages/*

  release:
    needs: publish-gui
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Set version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-local"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: ./artifacts
      - name: Attach GUI artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          overwrite_files: true
          files: |
            artifacts/csv2ofx-gui-linux-x64-package/Csv2Ofx-Gui-${{ env.VERSION }}-linux-x64.AppImage
            artifacts/csv2ofx-gui-osx-x64-package/Csv2Ofx-Gui-${{ env.VERSION }}-osx-x64.app.zip
            artifacts/csv2ofx-gui-osx-arm64-package/Csv2Ofx-Gui-${{ env.VERSION }}-osx-arm64.app.zip
            artifacts/csv2ofx-gui-win-x64-package/Csv2Ofx-Gui-${{ env.VERSION }}-win-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
